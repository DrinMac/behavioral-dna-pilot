services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: behavioral_dna
      POSTGRES_USER: behavioral_dna
      POSTGRES_PASSWORD: behavioral_dna_local
    volumes:
      - behavioral_dna_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U behavioral_dna -d behavioral_dna"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      APP_ENV: development
      SECRET_KEY: local-development-secret-change-me
      RESEARCHER_PASSWORD: change-me
      DATABASE_URL: postgresql+psycopg://behavioral_dna:behavioral_dna_local@db:5432/behavioral_dna
      TARGET_SESSIONS: 10
      STORE_KEY_VALUES: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  behavioral_dna_pg:
